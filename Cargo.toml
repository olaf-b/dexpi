[package]
name = "dexpi"
description = "Byte-faithful reader and writer for DEXPI 2.0 XML, with model loading and validation"
version = "0.1.0"
edition = "2024"
license = "(MIT OR Apache-2.0) AND CC-BY-4.0"
authors = ["Olaf Trygve Berglihn"]
repository = "https://github.com/olaf-b/dexpi"
keywords = ["dexpi", "p-and-id", "xml", "process-engineering"]
categories = ["parser-implementations", "science"]
exclude = ["tools/"]

[dependencies]
indexmap = "2.14.2"
quick-xml = "0.42.0"
thiserror = "2.0.20"
